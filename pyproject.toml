[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ind-chat"
version = "0.1.0"
description = "Domain-specific Indian-context LLM fine-tuning assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]
training = [
  "datasets>=2.20,<4",
  "peft>=0.12,<1",
  "transformers>=4.44,<5",
  "trl>=0.10,<1",
  "bitsandbytes>=0.43,<1",
  "torch>=2.3,<3",
]
evaluation = [
  "evaluate>=0.4,<1",
  "rouge-score>=0.1,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
